name: Daily Thawing Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch executable from build branch
        run: |
          git fetch origin build
          git checkout origin/build -- andy-thawing
          chmod +x andy-thawing

      - name: Run executable to generate images
        run: ./andy-thawing

      - name: Push output images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan output
          git rm -rf . || true
          git add dark.png light.png
          git commit -m "Auto-generated at $(date -u)"
          git push origin output --force
