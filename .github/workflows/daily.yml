name: Daily Thawing Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch executable from build branch
        run: |
          git fetch origin build
          git checkout origin/build -- andy-thawing
          chmod +x andy-thawing

      - name: Run executable to generate images
        run: ./andy-thawing

      - name: Commit and push output images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan output 2>/dev/null || git checkout output
          git rm -rf . 2>/dev/null || true
          git add dark.png light.png
          git commit -m "Auto-generated images at $(date -u)"
          git push origin output --force
