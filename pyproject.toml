[project]
name = "andy-thawing"
version = "1.0.0"
description = "刘德华解冻倒计时 - Andy Lau Thawing Countdown"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
]

[project.scripts]
andy-thawing = "andy_thawing.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andy_thawing"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]
